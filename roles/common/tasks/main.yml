---
# ==========================================
# SYSTEM BASICS
# ==========================================
- name: Set Timezone
  timezone:
    name: "{{ timezone }}"
    hwclock: UTC
  become: true

# ==========================================
# NATIVE PACKAGES (DNF)
# ==========================================
- include_tasks: rpmFusion.yml
- name: Install Native Packages (Hybrid Dictionary)
  dnf:
    name: "{{ (global_packages | default([], true)).values() | flatten +
    (host_packages | default([], true)).values() | flatten }}"
    state: present
  become: true

# ==========================================
# FLATPAK APPS 
# ==========================================
- name: Remove the default Fedora Flatpak repository
  community.general.flatpak_remote:
    name: fedora
    state: absent
  become: true

- name: Add Flathub repository
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  become: true

- name: Install Flatpak Apps
  community.general.flatpak:
    # Combines simple lists from vars.yml and host_vars
    name: "{{ (global_flatpaks | default({}, true)).values() | flatten + 
    (host_flatpaks | default({}, true)).values() | flatten }}"
    state: present
    remote: flathub
  become: true

# ==========================================
# Config Git
# ==========================================
- name: Configure Git with Secrets
  template:
    src: .gitconfig.j2
    dest: "{{ ansible_env.HOME }}/.gitconfig"
    mode: '0644'
  become: false

- include_tasks: multimedia.yml
  when: install_media_codecs | default(false) | bool
- include_tasks: 1password.yml
- include_tasks: mullvad.yml
- include_tasks: grub.yml
- include_tasks: firefox.yml

# ==========================================
# Config FW control
# ==========================================
- name: Get Framework Control
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ozturkkl/framework-control/main/install-linux.sh
    dest: /tmp/install-fw-ctrl.sh
    mode: '0700'

- name: Install Framework Control
  ansible.builtin.command: /tmp/install-fw-ctrl.sh
  args:
    creates: /usr/local/bin/framework-control
  become: true
